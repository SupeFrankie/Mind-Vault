{% extends "base.html" %}{% block title %}Groups{% endblock %}
{% block content %}<h1 class="text-2xl font-bold">Study groups</h1>
<p><a href="{% url 'sharing:group_create' %}">+ New group</a> · <a href="{% url 'sharing:group_join' %}">Join with a code</a></p>
<ul>{% for m in memberships %}<li><a href="{% url 'sharing:group_detail' m.group_id %}">{{ m.group.name }}</a> <small>{{ m.get_role_display }}</small></li>
{% empty %}<li>You are not in any group yet.</li>{% endfor %}</ul>{% endblock %}
