{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a class="button button-secondary button-small" rel="prev" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% else %}<span class="button button-secondary button-small" aria-disabled="true">Previous</span>{% endif %}<span class="pagination-current" aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button button-secondary button-small" rel="next" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% else %}<span class="button button-secondary button-small" aria-disabled="true">Next</span>{% endif %}</nav>{% endif %}
