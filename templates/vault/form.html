{% extends "base.html" %}
{% block title %}{{ title }} | MindVault{% endblock %}
{% block content %}<div class="workspace-page form-page"><header class="page-heading"><div><span class="eyebrow">WORKSPACE</span><h1>{{ title }}</h1><p>Enter the details below. You can review your changes before saving.</p></div></header><section class="surface-panel form-panel"><form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %} class="styled-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button button-primary" type="submit">{{ submit|default:"Save" }}</button><a class="button button-secondary" href="{{ cancel_url }}">Cancel</a></div></form></section></div>{% endblock %}
