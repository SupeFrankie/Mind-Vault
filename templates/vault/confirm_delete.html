{% extends "base.html" %}
{% block title %}Delete {{ label }} | MindVault{% endblock %}
{% block content %}<div class="workspace-page form-page"><header class="page-heading"><div><span class="eyebrow eyebrow-danger">DESTRUCTIVE ACTION</span><h1>Delete {{ label }}?</h1><p>This action cannot be undone.</p></div></header><section class="surface-panel confirmation-panel"><div class="confirmation-copy"><h2>{{ object }}</h2>{% if detail %}<p>{{ detail }}</p>{% endif %}</div><form method="post" class="form-actions">{% csrf_token %}<button class="button button-danger" type="submit">Yes, delete {{ label }}</button><a class="button button-secondary" href="{{ cancel_url }}">Cancel</a></form></section></div>{% endblock %}
